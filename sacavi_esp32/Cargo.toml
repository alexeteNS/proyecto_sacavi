[package]
name = "sacavi_esp32"
version = "0.1.0"
authors = ["AlexeteNS "]
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]

esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = ["esp32c3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
esp-hal = { version = "1.1.1", features = ["esp32c3", "log-04", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
esp-radio = { version = "0.18.0", features = ["esp32c3", "wifi", "log-04", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp-radio", "embassy", "esp32c3", "log-04"] }
log = { version = "0.4.22" }

embassy-executor = "0.10.0"
embassy-time = "0.4.0"
embassy-net = { version = "0.6", default-features = false, features = ["tcp", "udp", "dhcpv4", "medium-ethernet", "dns"] }
static_cell = "2.1.1"
embedded-websocket = { version = "0.9.5", default-features = false }

[profile.dev]
opt-level = 3

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false
