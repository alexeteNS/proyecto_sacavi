name: sacavi_app
description: "SACAVI — Sistema de Control de Acceso Vehicular Universitario"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.6.1

  # HTTP client
  dio: ^5.7.0

  # Storage for JWT and user session
  shared_preferences: ^2.2.3

  # QR code generation
  qr_flutter: ^4.1.0

  # Dependency injection
  get_it: ^7.7.0

  # Date formatting
  intl: ^0.19.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
