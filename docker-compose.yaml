services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sacavi
      POSTGRES_PASSWORD: zambrandon22032007
      POSTGRES_DB: sacavi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://sacavi:zambrandon22032007@db/sacavi
      JWT_SECRET: clave_super_secreta
      SERVER_PORT: "3000"

volumes:
  pgdata:
