[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
#password hash
argon2 = { version = "0.5.3", features = ["rand"] }
#apirest
axum = "0.8.9"
#dotenv
dotenvy = "0.15.7"
#jsonwebtokens
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
rand = "0.10.2"
rand_core = { version = "0.6", features = ["getrandom"] }
#postgresSQL
sea-orm = { version = "2.0", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros"
] }
sea-orm-migration = { version = "2.0", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls"
] }
migration = { path = "migration" }
#parser json
serde = "1.0.229"
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
#error back
thiserror = "2.0.19"
#async
tokio = { version = "1.53.1", features = ["full"] }
#dates
chrono = "0.4"
#CORS
tower-http = { version = "0.7.0", features = ["cors"] }
#System Logs
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
#UUID
uuid = { version = "1", features = ["v4"] }
#validator data
validator = "0.20.0"
reqwest = "0.13.4"
#request

[target.x86_64-unknown-linux-gnu]
linker = "cc"
